spring:
  application:
    name: SecureFlow
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/secureflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:secureflow}
    password: ${DB_PASSWORD:secureflow123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    time-zone: UTC

management.endpoints.web.exposure.include: health,info
springdoc.swagger-ui.path: /swagger-ui.html

monitoring:
  amount-limit: 10000.00
  currency: INR
  max-transactions: 5
  window-minutes: 10
