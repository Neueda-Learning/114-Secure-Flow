<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SecureFlow Beginner</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
    <div>
        <h1>SecureFlow</h1>
        <p>Simple INR transaction monitoring</p>
    </div>
    <div class="links">
        <span id="health">Checking health...</span>
        <a href="/swagger-ui.html">Swagger API</a>
    </div>
</header>

<main>
    <p id="message" class="message"></p>

    <section class="cards">
        <article><span>Active alerts</span><strong id="active-alerts">-</strong></article>
        <article><span>Transactions today</span><strong id="transactions-today">-</strong></article>
        <article><span>Alerts today</span><strong id="alerts-today">-</strong></article>
        <article><span>Volume today</span><strong id="volume-today">-</strong></article>
    </section>

    <section class="panel">
        <h2>Add a transaction</h2>
        <form id="transaction-form" class="form-grid">
            <label>Account ID
                <input id="accountId" maxlength="50" required>
            </label>
            <label>Payee ID
                <input id="payeeId" maxlength="50" required>
            </label>
            <label>Amount in INR
                <input id="amount" type="number" min="0.01" step="0.01" required>
            </label>
            <label>Description
                <input id="description" maxlength="255">
            </label>
            <button type="submit">Save and check rules</button>
        </form>
    </section>

    <section class="panel">
        <h2>Monitoring rules</h2>
        <div id="rules" class="rule-list"></div>
    </section>

    <section class="panel">
        <div class="section-heading">
            <h2>Transactions</h2>
            <form id="search-form">
                <input id="search" placeholder="Account, payee or description">
                <input id="minAmount" type="number" min="0" placeholder="Minimum amount">
                <input id="maxAmount" type="number" min="0" placeholder="Maximum amount">
                <button type="submit">Search</button>
                <button id="clear-search" type="button" class="secondary">Clear</button>
            </form>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                <tr><th>ID</th><th>Account</th><th>Payee</th><th>Amount</th><th>Time (IST)</th></tr>
                </thead>
                <tbody id="transactions"></tbody>
            </table>
        </div>
    </section>

    <section class="panel">
        <h2>Alerts</h2>
        <div class="table-scroll">
            <table>
                <thead>
                <tr><th>Rule</th><th>Account</th><th>Severity</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="alerts"></tbody>
            </table>
        </div>
    </section>
</main>

<dialog id="alert-dialog">
    <button id="close-dialog" class="close" type="button">Close</button>
    <div id="alert-details"></div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
