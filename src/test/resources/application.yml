spring:
  datasource:
    url: jdbc:h2:mem:secureflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway.enabled: true

monitoring:
  amount-limit: 10000.00
  currency: INR
  max-transactions: 5
  window-minutes: 10
