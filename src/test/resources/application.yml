spring:
  datasource:
    url: jdbc:h2:mem:secureflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

monitoring:
  rules:
    amount:
      enabled: true
      threshold: 10000.00
      currency: USD
    velocity:
      enabled: true
      maximum-transactions: 5
      window-minutes: 10
    new-payee:
      enabled: true
