name: CI and CD

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    name: test-and-package
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test, check coverage and build the JAR
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

      - name: Save the JAR and coverage report
        uses: actions/upload-artifact@v4
        with:
          name: secureflow-build
          path: |
            target/secureflow-*.jar
            target/site/jacoco/

  container-system-test:
    name: MySQL, Compose and browser checks
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Start the application with MySQL
        run: docker compose up --build --detach --wait

      - name: Verify health, MySQL persistence and non-root runtime
        run: bash scripts/verify-running-app.sh

      - name: Verify named-volume persistence across restart
        run: bash scripts/verify-volume-persistence.sh

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility checks
        run: npm run test:browser

      - name: Save browser-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Save container logs after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the disposable test environment
        if: always()
        run: docker compose down --volumes --remove-orphans

  deliver-image:
    name: Publish container image
    if: github.event_name == 'push'
    needs: [test-and-package, container-system-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image and publish it from main
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/neueda-learning/114-secure-flow:latest
