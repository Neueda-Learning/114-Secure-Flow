name: CI and CD

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test, check coverage and build the JAR
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

      - name: Save the JAR and coverage report
        uses: actions/upload-artifact@v4
        with:
          name: secureflow-build
          path: |
            target/secureflow-*.jar
            target/site/jacoco/

      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image and publish it from main
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/neueda-learning/114-secure-flow:latest
