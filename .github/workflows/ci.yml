name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: secureflow
          MYSQL_USER: secureflow
          MYSQL_PASSWORD: secureflow
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests, check coverage, and build JAR
        run: ./mvnw --batch-mode clean verify

      - name: Smoke-test the packaged application
        env:
          DB_URL: jdbc:mysql://localhost:3306/secureflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: secureflow
          DB_PASSWORD: secureflow
        run: |
          java -jar target/secureflow-*.jar > application.log 2>&1 &
          APP_PID=$!
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
              kill "$APP_PID"
              exit 0
            fi
            sleep 2
          done
          cat application.log
          kill "$APP_PID" || true
          exit 1

      - name: Validate Linux Docker deployment
        env:
          DB_PASSWORD: compose-validation-only
        run: |
          docker compose config --quiet
          docker build --tag secureflow:ci .

      - name: Upload runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: secureflow-jar
          path: target/secureflow-*.jar
          if-no-files-found: error

      - name: Upload test coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
