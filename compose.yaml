name: secureflow

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: secureflow
      MYSQL_USER: secureflow
      MYSQL_PASSWORD: ${DB_PASSWORD:-secureflow123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root12345}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://database:3306/secureflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: secureflow
      DB_PASSWORD: ${DB_PASSWORD:-secureflow123}
      DEMO_SEED_ON_STARTUP: "true"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mysql-data:
